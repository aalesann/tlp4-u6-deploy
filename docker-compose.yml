services:
  floci:
    image: floci/floci:latest
    container_name: tlp4-floci
    ports:
      - "4566:4566"
    volumes:
      # Floci needs the Docker socket to start real containers for some services.
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist emulator state across restarts.
      - floci-data:/app/data
    environment:
      FLOCI_STORAGE_MODE: hybrid

  # AWS CLI that runs inside the compose network, so it reaches Floci by name.
  # Works the same on Linux, macOS and Windows (no host networking needed).
  # Usage: docker compose run --rm aws s3 ls
  aws:
    image: amazon/aws-cli:latest
    profiles: ["tools"]
    entrypoint: ["aws"]
    working_dir: /work
    volumes:
      - .:/work
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      - floci

  postgres:
    image: postgres:16-alpine
    container_name: tlp4-postgres
    environment:
      POSTGRES_USER: tlp4
      POSTGRES_PASSWORD: tlp4
      POSTGRES_DB: tlp4
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: tlp4-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  floci-data:
  postgres-data:
  mongo-data:
